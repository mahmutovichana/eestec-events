# Objavljuje jednostavnu verziju (sheets/web) na GitHub Pages. Pokreće se samo kad se promijeni sheets/web.
# Prije prvog pokretanja: Settings → Pages → Source = "GitHub Actions" i (dok kod nije u main) Settings → Environments → github-pages →
# Deployment branches → dodati feat/sheets-simplification. Vidi sheets/docs/SETUP.md, korak 5.
name: Objava sheets/web na GitHub Pages
on:
  push:
    branches: [main, feat/sheets-simplification]
    paths: ["sheets/web/**", ".github/workflows/sheets-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sheets/web/package-lock.json
      - run: npm ci
        working-directory: sheets/web
      - run: npm run build
        working-directory: sheets/web
      - name: Provjeri artefakt (pravne stranice i konfiguracija)
        working-directory: sheets/web
        run: |
          test -f dist/index.html && test -f dist/privacy/index.html && test -f dist/terms/index.html && test -f dist/legal.css
          if grep -q 'class="confirm"' dist/privacy/index.html dist/terms/index.html; then
            echo "::warning::Pravne stranice još sadrže oznake [POTVRDITI]. Ne šaljite ih Googleu na verifikaciju dok se ne riješe (sheets/docs/LEGAL.md)."
          fi
          if grep -Eq 'apiUrl: *"",|clientId: *""' dist/config.js; then
            echo "::warning::dist/config.js nema apiUrl/clientId: aplikacija će prikazati da nije povezana sa serverom."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sheets/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
