# Objavljuje jednostavnu verziju (sheets/web) na GitHub Pages. Pokreće se samo kad se promijeni sheets/web.
# Prije prvog pokretanja: Settings → Pages → Source = "GitHub Actions". Vidi sheets/docs/SETUP.md.
name: Objava sheets/web na GitHub Pages
on:
  push:
    branches: [main]
    paths: ["sheets/web/**", ".github/workflows/sheets-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sheets/web/package-lock.json
      - run: npm ci
        working-directory: sheets/web
      - run: npm run build
        working-directory: sheets/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sheets/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
